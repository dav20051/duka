name: Database schema backup

# Saves the database STRUCTURE (tables, rules, functions; no shop or customer data)
# to supabase/schema.sql every Monday, and whenever started by hand (Actions → Run workflow).
# Needs the repository secret SUPABASE_DB_URL (see README.md → "Database backups").
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump schema (no data)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Add the SUPABASE_DB_URL secret first (see README.md)."; exit 1; fi
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL" --schema-only --no-owner --schema=public --schema=private' > supabase/schema.sql
          test -s supabase/schema.sql
      - name: Commit if changed
        run: |
          git config user.name "schema-backup"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/schema.sql
          git diff --cached --quiet || git commit -m "Database schema backup $(date -u +%F)"
          git push
