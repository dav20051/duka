<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1815">
<meta name="description" content="Duka: sales, stock and customer debts for Kenyan shops. Works offline, M-Pesa ready.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Duka</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f6f5;color:#1a1a1a}
main{padding:14px 14px 90px;max-width:560px;margin:auto}main.c{padding-top:60px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #cbd5d1;border-radius:10px;font:inherit;background:#fff}
button{padding:11px 14px;border:1px solid #0f766e;background:#fff;color:#0f766e;border-radius:10px;font:inherit;cursor:pointer}
button.p,button.on{background:#0f766e;color:#fff}button.s{padding:6px 10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;padding:10px 12px;margin:6px 0;border-radius:10px}
.row small{color:#6b7280;display:block}.low{color:#b91c1c;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#fff;border-radius:10px;padding:12px}
.card b{display:block;font-size:20px}.m{display:flex;gap:6px;margin:8px 0}.m button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde3e0}
nav button{flex:1;border:0;border-radius:0;padding:16px 0;color:#444}nav button.on{background:#0f766e;color:#fff}
h1{color:#0f766e;margin:0}h3{margin:18px 0 4px}a{color:#0f766e}.lb{display:block;font-size:13px;color:#6b7280;margin-top:8px}.ex{color:#b45309;font-weight:600}
:root{color-scheme:dark;--bg:#1d1815;--card:#2a2320;--line:#3d3430;--tx:#f0e6d8;--mut:#a89684;--accent:#e2a65b;--on:#2a1d0e;--gold:#e2a65b;--rose:#d9786a}
:root[data-theme=light]{color-scheme:light;--bg:#efe5d6;--card:#fbf5ea;--line:#dccfba;--tx:#3a2e27;--mut:#8a7866;--accent:#b9702f;--on:#fff8ee;--gold:#c9923a;--rose:#c0604f}
body{background:var(--bg);color:var(--tx)}
input,select{background:var(--card);color:var(--tx);border-color:var(--line)}
input::placeholder{color:var(--mut)}
button{background:transparent;color:var(--accent);border-color:var(--accent)}
button.p,button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.row,.card{background:var(--card);border-radius:14px}
.row small,.lb,.card small{color:var(--mut)}.card small{display:block}
.low{color:var(--rose)}.ex{color:var(--gold)}
nav{background:var(--card);border-top:1px solid var(--line)}
nav button{color:var(--mut);background:transparent}nav button.on{background:var(--accent);color:var(--on)}
h1,a{color:var(--accent)}
.hero small{color:var(--mut)}.hero h2{margin:2px 0 14px;font-size:24px}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;background:var(--card);border-radius:14px;padding:12px 10px 6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;opacity:.9}
.bar small{font-size:11px;color:var(--mut)}
.mix{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line)}.mix i{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:14px 16px 24px;border-radius:18px 18px 0 0}
.sheet h3{margin-top:4px}
.plans{display:grid;gap:10px;margin:10px 0}
.plan{position:relative;border:1px solid var(--line)}.plan.pop{border-color:var(--accent)}.plan.cur{outline:2px solid var(--accent)}
.plan em{position:absolute;top:-10px;right:12px;background:var(--accent);color:var(--on);font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px}
.pn{display:block;font-weight:600;color:var(--accent)}.plan b small{display:inline;font-size:13px;font-weight:400}
.plan ul{margin:8px 0 0;padding-left:18px;font-size:14px}.plan li{margin:2px 0}
.ob{background:var(--card);border:1px solid var(--gold);color:var(--tx);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ob.err{border-color:var(--rose)}.pend{color:var(--gold);font-size:12px}
.rc{background:#fff;color:#111;border-radius:10px;padding:14px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.rc h4{margin:0;text-align:center;font-size:15px}.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rc .l{display:flex;justify-content:space-between;gap:8px}.rc .t{font-weight:700;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.row.tap:active{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips.per{margin:0 0 10px}
.ib{display:flex;gap:6px;align-items:center}.ib input{flex:1}
.why{display:grid;gap:8px;margin:8px 0 4px}.why .pn{margin-bottom:2px}
.sticky{position:sticky;bottom:0;z-index:2;box-shadow:0 -8px 16px var(--bg)}
.qa3{display:flex;gap:4px}.qa3 input{width:64px;margin:0;padding:8px 6px;font-size:14px}.qb{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:45%}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 16px;border-radius:20px;z-index:60;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0;width:58mm;padding:0;border-radius:0;font-size:11px}@page{margin:3mm}}
</style></head><body>
<div id="app"></div>
<script src="vendor/supabase-js-2.45.4.js"></script>
<script src="i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/errors.js"></script>
<script src="js/screens.js"></script>
<script src="js/shop.js"></script>
<script src="js/export.js"></script>
<script src="js/admin.js"></script>
<script src="js/stock-tools.js"></script>
<script src="js/reports.js"></script>
<script src="js/suppliers.js"></script>
<script src="js/onboarding.js"></script>
<script src="js/demo.js"></script>
<script src="js/settings.js"></script>
</body></html>
