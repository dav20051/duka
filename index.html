<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d1815">
<meta name="description" content="Duka: sales, stock and customer debts for Kenyan shops. Works offline, M-Pesa ready.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Duka</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f6f5;color:#1a1a1a}
main{padding:14px 14px 90px;max-width:560px;margin:auto}main.c{padding-top:60px}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #cbd5d1;border-radius:10px;font:inherit;background:#fff}
button{padding:11px 14px;border:1px solid #0f766e;background:#fff;color:#0f766e;border-radius:10px;font:inherit;cursor:pointer}
button.p,button.on{background:#0f766e;color:#fff}button.s{padding:6px 10px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;padding:10px 12px;margin:6px 0;border-radius:10px}
.row small{color:#6b7280;display:block}.low{color:#b91c1c;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#fff;border-radius:10px;padding:12px}
.card b{display:block;font-size:20px}.m{display:flex;gap:6px;margin:8px 0}.m button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde3e0}
nav button{flex:1;border:0;border-radius:0;padding:16px 0;color:#444}nav button.on{background:#0f766e;color:#fff}
h1{color:#0f766e;margin:0}h3{margin:18px 0 4px}a{color:#0f766e}.lb{display:block;font-size:13px;color:#6b7280;margin-top:8px}.ex{color:#b45309;font-weight:600}
:root{color-scheme:dark;--bg:#1d1815;--card:#2a2320;--line:#3d3430;--tx:#f0e6d8;--mut:#a89684;--accent:#e2a65b;--on:#2a1d0e;--gold:#e2a65b;--rose:#d9786a}
:root[data-theme=light]{color-scheme:light;--bg:#efe5d6;--card:#fbf5ea;--line:#dccfba;--tx:#3a2e27;--mut:#8a7866;--accent:#b9702f;--on:#fff8ee;--gold:#c9923a;--rose:#c0604f}
body{background:var(--bg);color:var(--tx)}
input,select{background:var(--card);color:var(--tx);border-color:var(--line)}
input::placeholder{color:var(--mut)}
button{background:transparent;color:var(--accent);border-color:var(--accent)}
button.p,button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.row,.card{background:var(--card);border-radius:14px}
.row small,.lb,.card small{color:var(--mut)}.card small{display:block}
.low{color:var(--rose)}.ex{color:var(--gold)}
nav{background:var(--card);border-top:1px solid var(--line)}
nav button{color:var(--mut);background:transparent}nav button.on{background:var(--accent);color:var(--on)}
h1,a{color:var(--accent)}
.hero small{color:var(--mut)}.hero h2{margin:2px 0 14px;font-size:24px}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px;background:var(--card);border-radius:14px;padding:12px 10px 6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bar i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;opacity:.9}
.bar small{font-size:11px;color:var(--mut)}
.mix{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--line)}.mix i{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:14px 16px 24px;border-radius:18px 18px 0 0}
.sheet h3{margin-top:4px}
.plans{display:grid;gap:10px;margin:10px 0}
.plan{position:relative;border:1px solid var(--line)}.plan.pop{border-color:var(--accent)}.plan.cur{outline:2px solid var(--accent)}
.plan em{position:absolute;top:-10px;right:12px;background:var(--accent);color:var(--on);font-style:normal;font-size:12px;padding:2px 8px;border-radius:10px}
.pn{display:block;font-weight:600;color:var(--accent)}.plan b small{display:inline;font-size:13px;font-weight:400}
.plan ul{margin:8px 0 0;padding-left:18px;font-size:14px}.plan li{margin:2px 0}
.ob{background:var(--card);border:1px solid var(--gold);color:var(--tx);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ob.err{border-color:var(--rose)}.pend{color:var(--gold);font-size:12px}
.rc{background:#fff;color:#111;border-radius:10px;padding:14px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.rc h4{margin:0;text-align:center;font-size:15px}.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rc .l{display:flex;justify-content:space-between;gap:8px}.rc .t{font-weight:700;font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.row.tap:active{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.qb{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:45%}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:8px 16px;border-radius:20px;z-index:60;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3);pointer-events:none}
@media print{body *{visibility:hidden}#rcpt,#rcpt *{visibility:visible}#rcpt{position:absolute;left:0;top:0;width:58mm;padding:0;border-radius:0;font-size:11px}@page{margin:3mm}}
</style></head><body>

<script>
const SUPABASE_URL='https://tlcoxnnliwrvmnezsiqh.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsY294bm5saXdydm1uZXpzaXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMzY1MDUsImV4cCI6MjEwNjcxMjUwNX0.KpGzlT0Uplk1gWxBgByTBXkSF693zfo0bRjYilrU2Qc';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kes=n=>'KES '+Number(n||0).toLocaleString('en-KE');
// ---------- Business & pricing ----------
const BUSINESS='JOEDFRAME TECHNOLOGIES', SUPPORT_PHONE='254701252785', PAY_TO='0701 252 785';
// Display only: limits are enforced in the database (private.plan_limit).
const PLANS={
 basic:{name:'Basic',m:500,f:['1 staff account','Up to 300 products','Sell, stock & debts','WhatsApp debt reminders','Daily WhatsApp summary','Download your data']},
 standard:{name:'Standard',m:1000,f:['Up to 5 staff accounts','Unlimited products','Everything in Basic','Profit & stock value','7-day chart & top sellers']},
 premium:{name:'Premium',m:2000,f:['Unlimited staff accounts','Unlimited products','Everything in Standard','Priority WhatsApp support','We load your stock list for you']}};
// [months, days added, price factor, label]
const PERIODS=[[1,30,1,'1 month'],[6,182,.9,'6 months · save 10%'],[12,365,10/12,'1 year · 2 months free']];
const planPrice=(p,mo)=>Math.round(PLANS[p].m*mo*PERIODS.find(x=>x[0]==mo)[2]);
const planName=p=>p=='trial'?'Free trial':(PLANS[p]||{name:p}).name;
const reports=()=>S.role!='staff'&&S.shop.plan!='basic';
function pricingHTML(cur){return`<div class="plans">${Object.entries(PLANS).map(([k,p])=>`<div class="card plan${k==cur?' cur':''}${k=='standard'?' pop':''}">
 ${k=='standard'?'<em>Most popular</em>':''}<span class="pn">${p.name}</span><b>${kes(p.m)}<small>/month</small></b>
 <small>6 months ${kes(planPrice(k,6))} · 1 year ${kes(planPrice(k,12))}</small><ul>${p.f.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`}
function payHTML(){const msg=encodeURIComponent(`Hello ${BUSINESS}, I have paid for Duka.\nShop: ${S.shop?S.shop.name:''}\nPlan (Basic/Standard/Premium): \nPeriod (1 month/6 months/1 year): \nM-Pesa code: `);
 const stk=S.settings&&S.settings.mpesa_stk_enabled&&S.role=='owner',cur=PLANS[S.shop&&S.shop.plan]?S.shop.plan:'standard';
 return`${stk?`<div class="card"><span class="pn">Pay now with M-Pesa</span><small>You get a prompt on your phone. Enter your M-Pesa PIN and your shop is activated straight away.</small>
 <label class="lb">Plan</label><select id="kp" onchange="stkCalc()">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}" ${k==cur?'selected':''}>${p.name}</option>`).join('')}</select>
 <label class="lb">Period</label><select id="km" onchange="stkCalc()">${PERIODS.map(([mo,,,l])=>`<option value="${mo}">${l}</option>`).join('')}</select>
 <label class="lb">M-Pesa phone number</label><input id="kn" type="tel" placeholder="0712345678" value="${esc(S.shop&&S.shop.phone||'')}">
 <p><button class="p" style="width:100%" id="kb" onclick="payStk(this)">Pay</button></p></div><h3>Or pay manually</h3>`:''}
 <div class="card"><span class="pn">How to pay</span><small>1. M-Pesa <b>Send Money</b> to <b>${PAY_TO}</b> (${BUSINESS}).<br>2. Send us the M-Pesa code on WhatsApp. We activate your shop within the hour.</small>
 <p><a href="https://wa.me/${SUPPORT_PHONE}?text=${msg}" target="_blank" rel="noopener"><button class="p" style="width:100%">Send M-Pesa code on WhatsApp</button></a></p></div>`}
function stkCalc(){const b=$('#kb');if(b)b.textContent=`Pay ${kes(planPrice($('#kp').value,+$('#km').value))}`}
async function payStk(btn){const phone=$('#kn').value.trim();if(!phone)return alert('Enter your M-Pesa phone number');
 btn.disabled=true;const old=btn.textContent;btn.textContent='Sending request…';
 const {data,error}=await sb.functions.invoke('mpesa-stk',{body:{shop_id:S.shop.id,plan:$('#kp').value,months:+$('#km').value,phone}});
 if(error){btn.disabled=false;btn.textContent=old;let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}return alert(m)}
 btn.textContent='Check your phone and enter your M-Pesa PIN…';
 for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,3000));
  const {data:st}=await sb.rpc('my_mpesa_status',{p_checkout:data.checkout_request_id});const s=st&&st[0];
  if(s&&s.status=='paid'){alert(`Payment received ✔ Paid until ${s.paid_until}`);closeEdit();return boot()}
  if(s&&s.status=='failed'){btn.disabled=false;btn.textContent=old;return alert('Payment not completed: '+(s.result_desc||'cancelled'))}}
 btn.disabled=false;btn.textContent=old;alert('We have not received confirmation yet. If you paid, your shop will be activated shortly.')}
function showPlans(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" onclick="if(event.target==this)closeEdit()"><div class="sheet"><h3>Plans</h3>
 <p class="lb">You are on <b>${esc(planName(S.shop.plan))}</b>, paid until ${esc(S.shop.paid_until||'-')}. Paying early adds to your remaining days.</p>${pricingHTML(S.shop.plan)}${payHTML()}<p><button onclick="closeEdit()" style="width:100%">Close</button></p></div></div>`);stkCalc()}
// ---------- Local storage helpers (never required for correctness) ----------
function lsGet(k,json){try{const v=localStorage.getItem(k);return json?JSON.parse(v):v}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v=='string'?v:JSON.stringify(v))}catch(e){}}
const isNet=e=>!navigator.onLine||/offline|fetch|network|load failed|timed? ?out/i.test(String(e&&e.message||e));
// Invite codes: remembered for 30 days after opening an invite link; the banner shows only on that visit.
let REF_FROM_LINK=null;
try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{3,12}$/.test(r)){REF_FROM_LINK=r.toUpperCase();lsSet('duka:ref',{code:REF_FROM_LINK,at:Date.now()})}}catch(e){}
function savedRef(){const v=lsGet('duka:ref',true);if(!v||typeof v!='object'||!v.code||Date.now()-v.at>30*864e5){lsSet('duka:ref','');return''}return v.code}
const S={tab:'sell',cart:{},method:'cash',cust:'',q:'',products:[],customers:[],days:[]};
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'});

function authView(){S.inApp=false;const ref=REF_FROM_LINK;app.innerHTML=`<main class="c"><h1>Duka</h1><p>Sales, stock and debts for your shop.</p>
${ref?`<div class="ob">Invited with code ${esc(ref)}: create an account to start your 30 days free.</div>`:''}
<p><button class="s" onclick="setLang(LANG=='sw'?'en':'sw')">🌐 ${LANG=='sw'?'English':'Kiswahili'}</button></p>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (8+ characters)">
<button class="p" onclick="auth('in')">Log in</button> <button onclick="auth('up')">Create account</button><p><a href="#" onclick="forgot();return false">Forgot password?</a></p>
<p class="lb">By creating an account you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
<h3>Simple pricing</h3><p class="lb">Start with 30 days free, with all Standard features. Pay by M-Pesa. Save up to 2 months when you pay yearly.</p>${pricingHTML()}
<p class="lb">Questions? <a href="https://wa.me/${SUPPORT_PHONE}" target="_blank" rel="noopener">WhatsApp ${PAY_TO}</a></p></main>`}
async function auth(m){const e=$('#em').value.trim(),p=$('#pw').value;
 const r=m=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
 if(r.error)return alert(r.error.message);
 if(!r.data.session)return alert('Check your email to confirm, then log in.');boot()}
function setupView(){S.inApp=false;app.innerHTML=`<main class="c"><h1>Set up your shop</h1><p>30 days free.</p>
<input id="sn" placeholder="Shop name"><input id="sp" placeholder="Shop phone (optional)"><select id="st">${TYPES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><p><small>Choose carefully: this decides which fields your shop sees, and only we can change it later.</small></p>
<label class="lb">Referral or agent code (optional)</label><input id="sr" value="${esc(savedRef())}" style="text-transform:uppercase">
<button class="p" onclick="createShop()">Start</button> <button onclick="logout()">Log out</button></main>`}
async function createShop(){const n=$('#sn').value.trim();if(!n)return alert('Enter the shop name');
 const {error}=await sb.rpc('create_shop',{p_name:n,p_phone:$('#sp').value.trim()||null,p_type:$('#st').value,p_ref:$('#sr').value.trim()||null});
 if(error&&/code was not found/i.test(error.message)){lsSet('duka:ref','');$('#sr').value='';
  return alert('That referral or agent code is not valid. It has been cleared: check it or tap Start to continue without a code.')}
 if(error)return alert(error.message);lsSet('duka:ref','');boot()}
function lockedView(){S.inApp=false;
 app.innerHTML=`<main class="c"><h1>${S.shop.plan=='trial'?'Free trial ended':'Subscription ended'}</h1><p>Choose a plan to keep using Duka for <b>${esc(S.shop.name)}</b>. Your records are safe and nothing has been deleted.</p>
 ${S.role=='owner'?pricingHTML(S.shop.plan)+payHTML():'<p>Ask the shop owner to renew the subscription.</p>'}
 <p class="lb">You can still download your records:</p>${S.role=='owner'?exportButtons():''}
 ${S.members&&S.members.length>1?shopSwitcher():''}
 <p>${S.admin?'<button onclick="loadAdmin()">Admin</button> ':''}<button onclick="logout()">Log out</button></p></main>`}
async function logout(){await sb.auth.signOut();S.shop=null;S.members=null;authView()}

// ---------- Start-up: works online, and offline from the last saved copy ----------
const CACHE_KEYS=['members','shop','role','admin','settings','products','customers','days','sales','invites','refs'];
function saveCache(){if(!S.uid)return;const c={};CACHE_KEYS.forEach(k=>c[k]=S[k]);lsSet('duka:cache:'+S.uid,c)}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView();
 if(S.rec)return recoverView();S.uid=session.user.id;
 try{
  if(!navigator.onLine)throw new Error('offline');
  await sb.rpc('claim_invites');
  const [ad,st,mb]=await Promise.all([sb.rpc('am_i_admin'),sb.rpc('app_settings'),
   sb.from('shop_members').select('role,shops(id,name,phone,paid_until,type,plan,parent_id,referral_code,kra_pin)').eq('user_id',S.uid)]);
  if(mb.error)throw mb.error;
  S.admin=ad.data===true;S.settings=st.data||{};
  S.members=(mb.data||[]).filter(m=>m.shops).sort((a,b)=>(a.shops.parent_id?1:0)-(b.shops.parent_id?1:0)||a.shops.name.localeCompare(b.shops.name));
  if(!S.members.length)return S.admin?loadAdmin():setupView();
  const want=lsGet('duka:shop:'+S.uid),m=S.members.find(x=>x.shops.id==want)||S.members[0];
  S.shop={...m.shops};S.role=m.role;
  const {data:b,error:be}=await sb.rpc('shop_billing',{p_shop:S.shop.id});if(be)throw be;
  if(b&&b[0])Object.assign(S.shop,{plan:b[0].plan,paid_until:b[0].paid_until,is_branch:b[0].is_branch,main_shop:b[0].main_shop,branches:+b[0].branches});
  if(S.shop.paid_until&&S.shop.paid_until<today())return lockedView();
  await load();S.offline=false;saveCache();
  if(S.admin&&!S.adminShown){S.adminShown=true;return loadAdmin()} // platform admins land on Admin first
 }catch(e){
  const c=lsGet('duka:cache:'+S.uid,true);
  if(!isNet(e))return alert(e.message||e);
  if(!c||!c.shop){S.inApp=false;app.innerHTML=`<main class="c"><h1>Duka</h1><p>You are offline. Connect to the internet once to load your shop, then Duka keeps working offline.</p><button class="p" onclick="boot()">Try again</button></main>`;return}
  CACHE_KEYS.forEach(k=>S[k]=c[k]);S.offline=true;
 }
 render();syncQueue()}
async function load(){const sid=S.shop.id;
 const [p,c,d,sl,si]=await Promise.all([
  sb.from('products').select('*').eq('shop_id',sid).eq('active',true).order('name'),
  sb.from('customer_balances').select('*').eq('shop_id',sid).order('name'),
  sb.from('daily_summary').select('*').eq('shop_id',sid).order('day',{ascending:false}).limit(7),
  sb.from('sales').select('id,created_at,total,paid,method,mpesa_code,customer_id,voided,sale_items(id,name,qty,unit_price,unit_cost)').eq('shop_id',sid).gte('created_at',new Date(Date.now()-7*864e5).toISOString()).order('created_at',{ascending:false}).limit(300),
  S.role=='owner'?sb.from('staff_invites').select('*').eq('shop_id',sid).order('created_at'):Promise.resolve({data:[]})]);
 const err=[p,c,d,sl,si].find(r=>r.error);if(err)throw err.error;
 S.products=p.data||[];S.customers=c.data||[];S.days=d.data||[];S.sales=sl.data||[];S.invites=si.data||[];
 if(S.role=='owner'&&!S.shop.is_branch){const {data:r}=await sb.rpc('my_referrals',{p_shop:sid});S.refs=r&&r[0]||{signed_up:0,rewarded:0}}
 // Show sales still waiting to sync so the shop sees what it sold offline.
 const pend=queue().filter(x=>x.sale.shop_id==sid&&!S.sales.some(s=>s.id==x.sale.id));
 S.sales=[...pend.map(x=>({...x.sale,voided:false,sale_items:x.items,pending:true})),...S.sales]}

// ---------- Offline sales queue ----------
const QK=()=>'duka:queue:'+S.uid;
const queue=()=>lsGet(QK(),true)||[];
const setQueue=q=>lsSet(QK(),q);
// Ids are created on the phone, so retrying after a dropped connection never makes a duplicate.
async function pushSale(x){let r=await sb.from('sales').insert(x.sale);if(r.error&&r.error.code!='23505')throw r.error;
 r=await sb.from('sale_items').insert(x.items);if(r.error&&r.error.code!='23505')throw r.error}
let syncing=false;
async function syncQueue(){if(syncing||!navigator.onLine||!S.uid)return;let q=queue();if(!q.length)return;syncing=true;let sent=0;
 try{while(q.length){try{await pushSale(q[0])}catch(e){if(!isNet(e)){q[0].error=String(e.message||e);setQueue(q)}break}
  q.shift();setQueue(q);sent++}}
 finally{syncing=false}
 if(sent&&S.inApp&&S.shop){try{await load();S.offline=false;saveCache()}catch(e){}render()}else if(S.inApp)render()}
addEventListener('online',()=>{S.offline=false;syncQueue();if(S.inApp)boot()});
addEventListener('offline',()=>{S.offline=true;if(S.inApp)render()});
setInterval(syncQueue,60000);
function statusBar(){const q=queue(),err=q.find(x=>x.error);if(!S.offline&&!q.length)return'';
 return`<div class="ob${err?' err':''}"><span>${S.offline?'📴 Offline. Sales are saved on this phone.':'Online'}${q.length?` · ${q.length} sale(s) waiting to sync`:''}${err?`<br><small>Sync problem: ${esc(err.error)}</small>`:''}</span>${q.length&&navigator.onLine?'<button class="s" onclick="syncQueue()">Sync now</button>':''}</div>`}

// ---------- Branches (Premium) ----------
function shopSwitcher(){return`<label class="lb">Shop</label><select onchange="switchShop(this.value)">${S.members.map(m=>`<option value="${m.shops.id}" ${m.shops.id==S.shop.id?'selected':''}>${esc(m.shops.name)}${m.shops.parent_id?' (branch)':''}</option>`).join('')}</select>`}
function switchShop(id){lsSet('duka:shop:'+S.uid,id);S.tab='sell';S.cart={};boot()}
async function addBranch(){const n=(prompt('Name of the new branch')||'').trim();if(!n)return;
 const {data,error}=await sb.rpc('create_shop',{p_name:n,p_type:S.shop.type,p_parent:S.shop.id});
 if(error)return alert(error.message);switchShop(data)}
async function editKra(){const v=prompt('KRA PIN (e.g. P051234567X). Leave empty to remove.',S.shop.kra_pin||'');if(v===null)return;

function plist(){const q=S.q.toLowerCase();return S.products.filter(p=>(p.name+' '+(p.variant||'')+' '+(p.category||'')+' '+(p.sku||'')).toLowerCase().includes(q)).map(p=>
 `<div class="row tap" onclick="add('${p.id}')"><div>${pn(p)}<small>${kes(p.sell_price)}/${esc(p.unit)} · ${fq(p.stock_qty)} ${esc(p.unit)} left</small></div><button class="s">+ Add</button></div>`).join('')||'<p>No products. Add some in Stock.</p>'}
// Loose goods sold by weight, volume or length get quick amounts and "sell by money".
const LOOSE={kg:[.25,.5,1,2],L:[.25,.5,1,2],m:[.5,1,2,5],g:[100,250,500,1000],ml:[100,250,500,1000]};
const rq=n=>Math.round(n*1e4)/1e4, r2=n=>Math.round(n*100)/100;
const fq=n=>{n=+n;return{0.25:'¼',0.5:'½',0.75:'¾'}[n]||String(rq(n))};
const total=()=>r2(Object.entries(S.cart).reduce((a,[id,q])=>a+q*price(S.products.find(p=>p.id==id)),0));
function cartView(){const e=Object.entries(S.cart);if(!e.length)return'';const t=total();
 return`<h3 style="display:flex;justify-content:space-between;align-items:center">Cart <button class="s" onclick="clearCart()">Clear cart</button></h3>${e.map(([id,q])=>{const p=S.products.find(x=>x.id==id),qs=LOOSE[p.unit];return`<div class="row"><div>${pn(p)} × ${fq(q)} ${esc(p.unit)}<small>${kes(r2(q*price(p)))}${q>p.stock_qty?` · <span class="low">only ${fq(p.stock_qty)} in stock</span>`:''}</small>
  ${qs?`<div class="chips">${qs.map(v=>`<button class="s${+q==v?' on':''}" onclick="setQ('${id}',${v})">${fq(v)}</button>`).join('')}<button class="s" onclick="byMoney('${id}')">By KES</button></div>`:''}</div>
  <div class="qb"><button class="s" onclick="dec('${id}')">−</button><button class="s" onclick="add('${id}',true)">+</button><button class="s" onclick="setQty('${id}')">Qty</button>${S.role=='staff'?'':`<button class="s" onclick="setPrice('${id}')">Price</button>`}</div></div>`}).join('')}
 <div class="m">${['cash','mpesa','debt'].map(m=>`<button class="${S.method==m?'on':''}" onclick="S.method='${m}';$('#cart').innerHTML=cartView()">${m=='mpesa'?'M-Pesa':m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
 ${S.method=='debt'?`<select onchange="S.cust=this.value"><option value="">Choose customer</option>${S.customers.map(c=>`<option value="${c.customer_id}" ${S.cust==c.customer_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:''}
 ${S.method=='cash'?`<div class="g"><input id="given" type="number" inputmode="numeric" placeholder="Customer gave (optional)" value="${S.given||''}" oninput="S.given=this.value;$('#chg').innerHTML=changeText()"><div class="card" id="chg" style="padding:10px 12px">${changeText()}</div></div>`:''}
 <button class="p" style="width:100%" onclick="checkout()">Sell · ${kes(t)}</button>`}
function changeText(){const g=+S.given,t=total();if(!g)return'<small>Change</small>';
 return g<t?`<small class="low">Short by ${kes(r2(t-g))}</small>`:`<small>Change</small><b style="font-size:18px">${kes(r2(g-t))}</b>`}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;d.setAttribute('data-nt','');document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function add(id,inCart){const p=S.products.find(x=>x.id==id),step=p.unit=='g'||p.unit=='ml'?100:1;
 S.cart[id]=rq((S.cart[id]||0)+step);$('#cart').innerHTML=cartView();
 if(!inCart){toast('✓ '+p.name+' · '+fq(S.cart[id])+' '+p.unit);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}}
function dec(id){const p=S.products.find(x=>x.id==id),step=p.unit=='g'||p.unit=='ml'?100:1;
 S.cart[id]=rq(S.cart[id]-Math.min(step,S.cart[id]>=step?step:S.cart[id]));if(S.cart[id]<=0)delete S.cart[id];$('#cart').innerHTML=cartView()}

function byMoney(id){const p=S.products.find(x=>x.id==id),pr=price(p);if(!(pr>0))return alert('Set a selling price for this product first');
 const a=parseFloat(prompt(`How much money? (KES)\n${p.name}: ${kes(pr)} per ${p.unit}`,''));if(!(a>0))return;
 S.cart[id]=rq(a/pr);$('#cart').innerHTML=cartView()}

async function checkout(){
 const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id==id),q}));
 const over=items.filter(({p,q})=>q>p.stock_qty);if(over.length&&!confirm('Not enough stock: '+over.map(({p})=>p.name+' ('+p.stock_qty+' left)').join(', ')+'. Sell anyway?'))return;
 const t=total();let paid=t,code=null;
 if(S.method=='debt'){if(!S.cust)return alert('Choose a customer');
  const a=prompt('Amount paid now (0 if none)','0');if(a===null)return;paid=Math.min(t,Math.max(0,+a||0))}
 if(S.method=='mpesa')code=(prompt('M-Pesa code (optional)')||'').toUpperCase()||null;
 const sid=crypto.randomUUID();
 const sale={id:sid,shop_id:S.shop.id,customer_id:S.method=='debt'?S.cust:null,total:t,paid,method:S.method,mpesa_code:code,created_by:S.uid,created_at:new Date().toISOString()};
 const rows=items.map(({p,q})=>({id:crypto.randomUUID(),sale_id:sid,shop_id:S.shop.id,product_id:p.id,name:p.name+(p.variant?' · '+p.variant:''),qty:q,unit_price:price(p),unit_cost:p.buy_price}));
 const x={sale,items:rows};let queued=false;
 try{if(!navigator.onLine)throw new Error('offline');await pushSale(x)}
 catch(e){if(!isNet(e))return alert(e.message||e);setQueue([...queue(),x]);queued=true;S.offline=!navigator.onLine}
 S.cart={};S.pr={};S.cust='';S.q='';S.given='';
 if(queued){items.forEach(({p,q})=>p.stock_qty=+p.stock_qty-q);S.sales.unshift({...sale,voided:false,sale_items:rows,pending:true});saveCache()}
 else{try{await load();saveCache()}catch(e){}}
 render();showReceipt({...sale,voided:false,sale_items:rows,pending:queued})}

 L.push('----','TOTAL: '+kes(s.total),'Paid: '+kes(s.paid)+' ('+(s.method=='mpesa'?'M-Pesa':s.method)+')');

 <div class="c">${esc(r.when)} · No. ${esc(r.no)}</div><hr>
 ${r.items.map(i=>`<div>${esc(i.name)}</div><div class="l"><span>${+i.qty} × ${kes(i.unit_price)}</span><span>${kes(i.qty*i.unit_price)}</span></div>`).join('')}<hr>
 <div class="l t"><span>TOTAL</span><span>${kes(s.total)}</span></div><div class="l"><span>Paid (${s.method=='mpesa'?'M-Pesa':esc(s.method)})</span><span>${kes(s.paid)}</span></div>
 ${+s.total>+s.paid?`<div class="l"><span>Balance</span><span>${kes(s.total-s.paid)}</span></div>`:''}${s.mpesa_code?`<div class="l"><span>M-Pesa code</span><span>${esc(s.mpesa_code)}</span></div>`:''}
 ${r.c?`<div class="l"><span>Customer</span><span>${esc(r.c.name)}</span></div>`:''}${s.voided?'<div class="c t">*** VOIDED ***</div>':''}<hr><div class="c">Asante! Thank you.</div></div>
 <div class="m"><button onclick="window.print()">🖨 Print</button><a style="flex:1" href="https://wa.me/${ph}?text=${encodeURIComponent(receiptText(s))}" target="_blank" rel="noopener"><button style="width:100%">WhatsApp</button></a><button class="p" onclick="closeEdit()">Close</button></div></div></div>`)}

 const t=Object.entries(m).sort((a,b)=>b[1].r-a[1].r).slice(0,5);

function payMix(){const td=today(),x={cash:0,mpesa:0,debt:0};
 S.sales.filter(s=>!s.voided&&new Date(s.created_at).toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'})==td).forEach(s=>{if(s.method in x)x[s.method]+= +s.total});
 const T=x.cash+x.mpesa+x.debt;if(!T)return'';const pc=k=>Math.round(x[k]/T*100);
 return`<h3>Today by payment</h3><div class="mix"><i style="width:${pc('cash')}%;background:var(--accent)"></i><i style="width:${pc('mpesa')}%;background:#8fb996"></i><i style="width:${pc('debt')}%;background:var(--rose)"></i></div><p class="lb">Cash ${kes(x.cash)} · M-Pesa ${kes(x.mpesa)} · Debt ${kes(x.debt)}</p>`}

function closeEdit(){const m=document.querySelector('.modal');if(m)m.remove()}
async function saveEdit(id){
 const p=S.products.find(x=>x.id==id),g=i=>{const e=$('#'+i);return e?e.value.trim():null};
 const name=g('en');if(!name)return alert('Enter a name');
 const q=+g('eq');if(isNaN(q)||q<0)return alert('Enter a valid stock quantity');
 const u={name,buy_price:+g('eb')||0,sell_price:+g('es')||0,stock_qty:q,unit:g('eu')||p.unit,low_stock_at:+g('er')||0};
 if(g('ec')!==null)u.category=g('ec')||null;
 if(g('ev')!==null)u.variant=g('ev')||null;
 if(g('ek')!==null)u.sku=g('ek')||null;
 if(g('ex')!==null)u.expiry=g('ex')||null;
 const {error}=await sb.from('products').update(u).eq('id',id);
 if(error)return alert(error.message.includes('products_shop_sku')?'That SKU is already used by another product':error.message);
 if(q!==+p.stock_qty)await sb.from('stock_movements').insert({shop_id:S.shop.id,product_id:id,change:q-p.stock_qty,reason:'adjustment'});
 closeEdit();await load();render()}

 const wd=d=>new Date(d+'T12:00:00').toLocaleDateString('en-KE',{weekday:'short'});
 const lab=n=>n?(n>=1000?(n/1000).toFixed(1)+'k':Math.round(n)):'';
 return`<h3>Last 7 days</h3><div class="bars">${days.map((d,i)=>`<div class="bar"><small>${lab(v[i])}</small><i style="height:${Math.max(3,Math.round(v[i]/mx*56))}px;${d==today()?'':'opacity:.6'}"></i><small>${wd(d)}</small></div>`).join('')}</div><p class="lb">Week: sales ${kes(v.reduce((a,b)=>a+b,0))} · profit ${kes(S.days.reduce((a,x)=>a+ +x.profit_estimate,0))}</p>`}
function summaryText(){const td=today(),t=S.days.find(d=>d.day==td)||{};
 const ts=S.sales.filter(s=>!s.voided&&new Date(s.created_at).toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'})==td);
 const by={cash:0,mpesa:0,debt:0};ts.forEach(s=>{if(s.method in by)by[s.method]+= +s.total});
 const m={};ts.forEach(s=>(s.sale_items||[]).forEach(i=>{m[i.name]=(m[i.name]||0)+ +i.qty}));
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,q])=>n+' x'+q).join(', ');
 const low=S.products.filter(p=>p.stock_qty<=p.low_stock_at).map(p=>p.name+' ('+p.stock_qty+')');
 const L=['*'+S.shop.name+' - '+td+'*','Sales: '+kes(t.sales_total)+' ('+ts.length+' sales)','Cash '+kes(by.cash)+' | M-Pesa '+kes(by.mpesa)+' | Debt '+kes(by.debt)];
 if(reports())L.push('Profit (est.): '+kes(t.profit_estimate));
 if(top)L.push('Top: '+top);
 L.push('Owed to you: '+kes(owed())+' ('+debtors()+' customers)');
 if(low.length)L.push('Running low: '+low.slice(0,8).join(', '));
 return L.join('\n')}

// ---------- CSV export (owners) ----------
// Prefix cells that Excel would treat as formulas (CSV injection), then quote when needed.
const csvCell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return/[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function download(name,rows){
 const blob=new Blob(['﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function fetchAll(build){const out=[];
 for(let from=0;;from+=1000){const {data,error}=await build().range(from,from+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
function exportButtons(){return`<div class="m"><button class="s" onclick="exportData('sales',this)">Sales</button><button class="s" onclick="exportData('stock',this)">Stock</button><button class="s" onclick="exportData('customers',this)">Customers</button></div>`}
async function exportData(kind,btn){
 const label=btn.textContent;btn.disabled=true;btn.textContent='…';
 try{
  const sid=S.shop.id,file=`${S.shop.name.replace(/[^\w-]+/g,'_')}-${kind}-${today()}.csv`;
  const dt=t=>new Date(t).toLocaleString('en-CA',{timeZone:'Africa/Nairobi',hour12:false}).replace(',','');
  if(kind=='sales'){
   const [sales,custs]=await Promise.all([
    fetchAll(()=>sb.from('sales').select('id,created_at,total,paid,method,mpesa_code,voided,customer_id,sale_items(name,qty,unit_price,unit_cost)').eq('shop_id',sid).order('created_at')),
    fetchAll(()=>sb.from('customer_balances').select('customer_id,name').eq('shop_id',sid))]);
   const cn=Object.fromEntries(custs.map(c=>[c.customer_id,c.name]));
   download(file,[['Date & time','Item','Qty','Unit price','Line total','Unit cost','Payment','M-Pesa code','Customer','Sale total','Paid','Voided'],
    ...sales.flatMap(s=>(s.sale_items.length?s.sale_items:[{}]).map(i=>[dt(s.created_at),i.name,i.qty,i.unit_price,i.qty*i.unit_price||'',i.unit_cost,s.method,s.mpesa_code,cn[s.customer_id]||'',s.total,s.paid,s.voided?'yes':'']))]);
  }else if(kind=='stock'){
   const p=await fetchAll(()=>sb.from('products').select('name,variant,category,sku,unit,buy_price,sell_price,stock_qty,low_stock_at,expiry,active').eq('shop_id',sid).order('name'));
   download(file,[['Name','Variant','Category','SKU','Unit','Buy price','Sell price','In stock','Reorder at','Expiry','Active'],
    ...p.map(x=>[x.name,x.variant,x.category,x.sku,x.unit,x.buy_price,x.sell_price,x.stock_qty,x.low_stock_at,x.expiry,x.active?'yes':'no'])]);
  }else{
   const c=await fetchAll(()=>sb.from('customer_balances').select('name,phone,balance').eq('shop_id',sid).order('name'));
   download(file,[['Name','Phone','Balance owed'],...c.map(x=>[x.name,x.phone,x.balance])]);
  }
 }catch(e){alert('Download failed: '+(e.message||e))}
 finally{btn.disabled=false;btn.textContent=label}}

async function adminType(id){const s=S.adm.find(x=>x.id==id);
 const t=prompt('Shop type: '+TYPES.map(x=>x[0]).join(', '),s.type);if(t===null||t.trim()==s.type)return;
 const {error}=await sb.rpc('admin_set_shop_type',{p_shop:id,p_type:t.trim().toLowerCase()});if(error)return alert(error.message);loadAdmin()}

// Actions that change records other than sales need the internet; sales work offline.
['addProduct','restock','addCustomer','payDebt','saveEdit','removeProduct','invite','rmStaff','voidSale','createShop','editKra','addBranch','sendSms','payStk','exportData','loadAdmin','showPlans']
 .forEach(n=>{const f=window[n];if(typeof f!='function')return;window[n]=function(...a){if(!navigator.onLine)return alert('You are offline. This needs internet. Selling still works offline.');return f.apply(this,a)}});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

boot();
