*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f6f5;color:#1a1a1a}

button{padding:11px 14px;border:1px solid #0f766e;background:#fff;color:#0f766e;border-radius:10px;font:inherit;cursor:pointer}

.qa3{display:flex;gap:4px}.qa3 input{width:64px;margin:0;padding:8px 6px;font-size:14px}.qb{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:45%}

const SUPABASE_URL='https://tlcoxnnliwrvmnezsiqh.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsY294bm5saXdydm1uZXpzaXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMzY1MDUsImV4cCI6MjEwNjcxMjUwNX0.KpGzlT0Uplk1gWxBgByTBXkSF693zfo0bRjYilrU2Qc';

 basic:{name:'Basic',m:500,f:['1 staff account','Up to 300 products','Sell, stock & debts','WhatsApp debt reminders','Daily WhatsApp summary','Download your data']},

 ${k=='standard'?'<em>Most popular</em>':''}<span class="pn">${p.name}</span><b>${kes(p.m)}<small>/month</small></b>

 const stk=S.settings&&S.settings.mpesa_stk_enabled&&S.role=='owner',cur=PLANS[S.shop&&S.shop.plan]?S.shop.plan:'standard';
 return`${stk?`<div class="card"><span class="pn">Pay now with M-Pesa</span><small>You get a prompt on your phone. Enter your M-Pesa PIN and your shop is activated straight away.</small>
 <label class="lb">Plan</label><select id="kp" onchange="stkCalc()">${Object.entries(PLANS).map(([k,p])=>`<option value="${k}" ${k==cur?'selected':''}>${p.name}</option>`).join('')}</select>
 <label class="lb">Period</label><select id="km" onchange="stkCalc()">${PERIODS.map(([mo,,,l])=>`<option value="${mo}">${l}</option>`).join('')}</select>
 <label class="lb">M-Pesa phone number</label><input id="kn" type="tel" placeholder="0712345678" value="${esc(S.shop&&S.shop.phone||'')}">
 <p><button class="p" style="width:100%" id="kb" onclick="payStk(this)">Pay</button></p></div><h3>Or pay manually</h3>`:''}
 <div class="card"><span class="pn">How to pay</span><small>1. M-Pesa <b>Send Money</b> to <b>${PAY_TO}</b> (${BUSINESS}).<br>2. Send us the M-Pesa code on WhatsApp. We activate your shop within the hour.</small>
 <p><a href="https://wa.me/${SUPPORT_PHONE}?text=${msg}" target="_blank" rel="noopener"><button class="p" style="width:100%">Send M-Pesa code on WhatsApp</button></a></p></div>`}
function stkCalc(){const b=$('#kb');if(b)b.textContent=`Pay ${kes(planPrice($('#kp').value,+$('#km').value))}`}
async function payStk(btn){const phone=$('#kn').value.trim();if(!phone)return alert('Enter your M-Pesa phone number');
 btn.disabled=true;const old=btn.textContent;btn.textContent='Sending request…';
 const {data,error}=await sb.functions.invoke('mpesa-stk',{body:{shop_id:S.shop.id,plan:$('#kp').value,months:+$('#km').value,phone}});
 if(error){btn.disabled=false;btn.textContent=old;let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}return alert(m)}
 btn.textContent='Check your phone and enter your M-Pesa PIN…';
 for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,3000));
  const {data:st}=await sb.rpc('my_mpesa_status',{p_checkout:data.checkout_request_id});const s=st&&st[0];
  if(s&&s.status=='paid'){alert(`Payment received ✔ Paid until ${s.paid_until}`);closeEdit();return boot()}
  if(s&&s.status=='failed'){btn.disabled=false;btn.textContent=old;return alert('Payment not completed: '+(s.result_desc||'cancelled'))}}
 btn.disabled=false;btn.textContent=old;alert('We have not received confirmation yet. If you paid, your shop will be activated shortly.')}
function showPlans(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" onclick="if(event.target==this)closeEdit()"><div class="sheet"><h3>Plans</h3>
 <p class="lb">You are on <b>${esc(planName(S.shop.plan))}</b>, paid until ${esc(S.shop.paid_until||'-')}. Paying early adds to your remaining days.</p>${pricingHTML(S.shop.plan)}${payHTML()}<p><button onclick="closeEdit()" style="width:100%">Close</button></p></div></div>`);stkCalc()}
// ---------- Local storage helpers (never required for correctness) ----------
function lsGet(k,json){try{const v=localStorage.getItem(k);return json?JSON.parse(v):v}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v=='string'?v:JSON.stringify(v))}catch(e){}}
const isNet=e=>!navigator.onLine||/offline|fetch|network|load failed|timed? ?out/i.test(String(e&&e.message||e));
// Invite codes: remembered for 30 days after opening an invite link; the banner shows only on that visit.
let REF_FROM_LINK=null;
try{const r=new URLSearchParams(location.search).get('ref');if(r&&/^[A-Za-z0-9]{3,12}$/.test(r)){REF_FROM_LINK=r.toUpperCase();lsSet('duka:ref',{code:REF_FROM_LINK,at:Date.now()})}}catch(e){}
function savedRef(){const v=lsGet('duka:ref',true);if(!v||typeof v!='object'||!v.code||Date.now()-v.at>30*864e5){lsSet('duka:ref','');return''}return v.code}
const S={tab:'sell',cart:{},method:'cash',cust:'',q:'',products:[],customers:[],days:[]};
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Africa/Nairobi'});

function authView(){S.inApp=false;const ref=REF_FROM_LINK;app.innerHTML=`<main class="c"><h1>Duka</h1><p>Sales, stock and debts for your shop.</p>
${ref?`<div class="ob">Invited with code ${esc(ref)}: create an account to start your 30 days free.</div>`:''}
<p><button class="s" onclick="setLang(LANG=='sw'?'en':'sw')">🌐 ${LANG=='sw'?'English':'Kiswahili'}</button></p>
<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (8+ characters)">
<button class="p" onclick="auth('in')">Log in</button> <button onclick="auth('up')">Create account</button><p><a href="#" onclick="forgot();return false">Forgot password?</a></p>
<p class="lb">By creating an account you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
<h3>Why shops use Duka</h3><div class="why">
<div class="card"><span class="pn">🔍 See what is missing from your shelves</span><small>Count your stock and Duka shows, in shillings, what has disappeared: theft, mistakes or damage. Many shops save more than the monthly fee.</small></div>
<div class="card"><span class="pn">⚡ Your whole shop ready in minutes</span><small>Load your stock list in one go instead of typing item by item. On Premium, we load it for you.</small></div>
<div class="card"><span class="pn">📒 Never forget who owes you</span><small>Every debt recorded, with reminders on WhatsApp or SMS.</small></div>
<div class="card"><span class="pn">📴 Works without internet</span><small>Keep selling when the network is down. Receipts by WhatsApp or printer.</small></div></div>
<h3>Simple pricing</h3><p class="lb">Start with 30 days free, with all Standard features. Pay by M-Pesa. Save up to 2 months when you pay yearly.</p>${pricingHTML()}
<p class="lb">Questions? <a href="https://wa.me/${SUPPORT_PHONE}" target="_blank" rel="noopener">WhatsApp ${PAY_TO}</a></p></main>`}
async function auth(m){const e=$('#em').value.trim(),p=$('#pw').value;
 const r=m=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});
 if(r.error)return alert(r.error.message);
 if(!r.data.session)return alert('Check your email to confirm, then log in.');boot()}
function setupView(){S.inApp=false;app.innerHTML=`<main class="c"><h1>Set up your shop</h1><p>30 days free.</p>
<input id="sn" placeholder="Shop name"><input id="sp" placeholder="Shop phone (optional)"><select id="st">${TYPES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><p><small>Choose carefully: this decides which fields your shop sees, and only we can change it later.</small></p>
<label class="lb">Referral or agent code (optional)</label><input id="sr" value="${esc(savedRef())}" style="text-transform:uppercase">
<button class="p" onclick="createShop()">Start</button> <button onclick="logout()">Log out</button></main>`}
async function createShop(){const n=$('#sn').value.trim();if(!n)return alert('Enter the shop name');
 const {error}=await sb.rpc('create_shop',{p_name:n,p_phone:$('#sp').value.trim()||null,p_type:$('#st').value,p_ref:$('#sr').value.trim()||null});
 if(error&&/code was not found/i.test(error.message)){lsSet('duka:ref','');$('#sr').value='';
  return alert('That referral or agent code is not valid. It has been cleared: check it or tap Start to continue without a code.')}
 if(error)return alert(error.message);lsSet('duka:ref','');boot()}
function lockedView(){S.inApp=false;
 app.innerHTML=`<main class="c"><h1>${S.shop.plan=='trial'?'Free trial ended':'Subscription ended'}</h1><p>Choose a plan to keep using Duka for <b>${esc(S.shop.name)}</b>. Your records are safe and nothing has been deleted.</p>
 ${S.role=='owner'?pricingHTML(S.shop.plan)+payHTML():'<p>Ask the shop owner to renew the subscription.</p>'}
 <p class="lb">You can still download your records:</p>${S.role=='owner'?exportButtons():''}
 ${S.members&&S.members.length>1?shopSwitcher():''}
 <p>${S.admin?'<button onclick="loadAdmin()">Admin</button> ':''}<button onclick="logout()">Log out</button></p></main>`}
async function logout(){await sb.auth.signOut();S.shop=null;S.members=null;authView()}

// ---------- Start-up: works online, and offline from the last saved copy ----------
const CACHE_KEYS=['members','shop','role','admin','settings','products','customers','days','sales','invites','refs','rep','repPrev','exps','counts','team'];
function saveCache(){if(!S.uid)return;const c={};CACHE_KEYS.forEach(k=>c[k]=S[k]);lsSet('duka:cache:'+S.uid,c)}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView();
 if(S.rec)return recoverView();S.uid=session.user.id;
 try{
  if(!navigator.onLine)throw new Error('offline');
  await sb.rpc('claim_invites');
  const [ad,st,mb]=await Promise.all([sb.rpc('am_i_admin'),sb.rpc('app_settings'),
   sb.from('shop_members').select('role,shops(id,name,phone,paid_until,type,plan,parent_id,referral_code,kra_pin)').eq('user_id',S.uid)]);
  if(mb.error)throw mb.error;
  S.admin=ad.data===true;S.settings=st.data||{};
  S.members=(mb.data||[]).filter(m=>m.shops).sort((a,b)=>(a.shops.parent_id?1:0)-(b.shops.parent_id?1:0)||a.shops.name.localeCompare(b.shops.name));
  if(!S.members.length)return S.admin?loadAdmin():setupView();
  const want=lsGet('duka:shop:'+S.uid),m=S.members.find(x=>x.shops.id==want)||S.members[0];
  S.shop={...m.shops};S.role=m.role;
  const {data:b,error:be}=await sb.rpc('shop_billing',{p_shop:S.shop.id});if(be)throw be;
  if(b&&b[0])Object.assign(S.shop,{plan:b[0].plan,paid_until:b[0].paid_until,is_branch:b[0].is_branch,main_shop:b[0].main_shop,branches:+b[0].branches});
  if(S.shop.paid_until&&S.shop.paid_until<today())return lockedView();
  await load();S.offline=false;saveCache();
  if(S.admin&&!S.adminShown){S.adminShown=true;return loadAdmin()} // platform admins land on Admin first
 }catch(e){
  const c=lsGet('duka:cache:'+S.uid,true);
  if(!isNet(e))return alert(e.message||e);
  if(!c||!c.shop){S.inApp=false;app.innerHTML=`<main class="c"><h1>Duka</h1><p>You are offline. Connect to the internet once to load your shop, then Duka keeps working offline.</p><button class="p" onclick="boot()">Try again</button></main>`;return}
  CACHE_KEYS.forEach(k=>S[k]=c[k]);S.offline=true;
 }
 render();syncQueue()}
async function load(){const sid=S.shop.id;
 const [p,c,d,sl,si]=await Promise.all([
  sb.from('products').select('*').eq('shop_id',sid).eq('active',true).order('name'),
  sb.from('customer_balances').select('*').eq('shop_id',sid).order('name'),
  sb.from('daily_summary').select('*').eq('shop_id',sid).order('day',{ascending:false}).limit(7),
  sb.from('sales').select('id,created_at,total,paid,method,mpesa_code,customer_id,voided,sale_items(id,name,qty,unit_price,unit_cost)').eq('shop_id',sid).gte('created_at',new Date(Date.now()-7*864e5).toISOString()).order('created_at',{ascending:false}).limit(300),
  S.role=='owner'?sb.from('staff_invites').select('*').eq('shop_id',sid).order('created_at'):Promise.resolve({data:[]})]);
 const err=[p,c,d,sl,si].find(r=>r.error);if(err)throw err.error;
 S.products=p.data||[];S.customers=c.data||[];S.days=d.data||[];S.sales=sl.data||[];S.invites=si.data||[];
 if(S.role=='owner'&&!S.shop.is_branch){const {data:r}=await sb.rpc('my_referrals',{p_shop:sid});S.refs=r&&r[0]||{signed_up:0,rewarded:0}}
 try{await loadReport()}catch(e){if(!isNet(e))console.warn(e)}
 // Show sales still waiting to sync so the shop sees what it sold offline.
 const pend=queue().filter(x=>x.sale.shop_id==sid&&!S.sales.some(s=>s.id==x.sale.id));
 S.sales=[...pend.map(x=>({...x.sale,voided:false,sale_items:x.items,pending:true})),...S.sales]}

// ---------- Offline sales queue ----------
const QK=()=>'duka:queue:'+S.uid;
const queue=()=>lsGet(QK(),true)||[];
const setQueue=q=>lsSet(QK(),q);
// Ids are created on the phone, so retrying after a dropped connection never makes a duplicate.
async function pushSale(x){let r=await sb.from('sales').insert(x.sale);if(r.error&&r.error.code!='23505')throw r.error;
 r=await sb.from('sale_items').insert(x.items);if(r.error&&r.error.code!='23505')throw r.error}
let syncing=false;
async function syncQueue(){if(syncing||!navigator.onLine||!S.uid)return;let q=queue();if(!q.length)return;syncing=true;let sent=0;
 try{while(q.length){try{await pushSale(q[0])}catch(e){if(!isNet(e)){q[0].error=String(e.message||e);setQueue(q)}break}
  q.shift();setQueue(q);sent++}}
 finally{syncing=false}
 if(sent&&S.inApp&&S.shop){try{await load();S.offline=false;saveCache()}catch(e){}render()}else if(S.inApp)render()}
addEventListener('online',()=>{S.offline=false;syncQueue();if(S.inApp)boot()});
addEventListener('offline',()=>{S.offline=true;if(S.inApp)render()});

// Tap anywhere on a product to add it.
function plist(){const q=S.q.toLowerCase();return S.products.filter(p=>(p.name+' '+(p.variant||'')+' '+(p.category||'')+' '+(p.sku||'')).toLowerCase().includes(q)).map(p=>
 `<div class="row tap" onclick="add('${p.id}')"><div>${pn(p)}<small>${kes(p.sell_price)}/${esc(p.unit)} · ${fq(p.stock_qty)} ${esc(p.unit)} left</small></div><button class="s">+ Add</button></div>`).join('')||'<p>No products. Add some in Stock.</p>'}
// Loose goods sold by weight, volume or length get quick amounts and "sell by money".
const LOOSE={kg:[.25,.5,1,2],L:[.25,.5,1,2],m:[.5,1,2,5],g:[100,250,500,1000],ml:[100,250,500,1000]};
const rq=n=>Math.round(n*1e4)/1e4, r2=n=>Math.round(n*100)/100;
const fq=n=>{n=+n;return{0.25:'¼',0.5:'½',0.75:'¾'}[n]||String(rq(n))};
const total=()=>r2(Object.entries(S.cart).reduce((a,[id,q])=>a+q*price(S.products.find(p=>p.id==id)),0));
function cartView(){const e=Object.entries(S.cart);if(!e.length)return'';const t=total();
 return`<h3 style="display:flex;justify-content:space-between;align-items:center">Cart <button class="s" onclick="clearCart()">Clear cart</button></h3>${e.map(([id,q])=>{const p=S.products.find(x=>x.id==id),qs=LOOSE[p.unit];return`<div class="row"><div>${pn(p)} × ${fq(q)} ${esc(p.unit)}<small>${kes(r2(q*price(p)))}${q>p.stock_qty?` · <span class="low">only ${fq(p.stock_qty)} in stock</span>`:''}</small>
  ${qs?`<div class="chips">${qs.map(v=>`<button class="s${+q==v?' on':''}" onclick="setQ('${id}',${v})">${fq(v)}</button>`).join('')}<button class="s" onclick="byMoney('${id}')">By KES</button></div>`:''}</div>
  <div class="qb"><button class="s" onclick="dec('${id}')">−</button><button class="s" onclick="add('${id}',true)">+</button><button class="s" onclick="setQty('${id}')">Qty</button>${S.role=='staff'?'':`<button class="s" onclick="setPrice('${id}')">Price</button>`}</div></div>`}).join('')}
 <div class="m">${['cash','mpesa','debt'].map(m=>`<button class="${S.method==m?'on':''}" onclick="S.method='${m}';$('#cart').innerHTML=cartView()">${m=='mpesa'?'M-Pesa':m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
 ${S.method=='debt'?`<select onchange="if(this.value=='__new'){this.value='';customerForm(null,id=>{S.cust=id;render()})}else{S.cust=this.value;$('#cart').innerHTML=cartView()}"><option value="">Choose customer</option><option value="__new">+ New customer</option>${activeCustomers().map(c=>`<option value="${c.customer_id}" ${S.cust==c.customer_id?'selected':''}>${esc(c.name)}${+c.balance>0?' · owes '+kes(c.balance):''}</option>`).join('')}</select>${custLine()}`:''}
 ${S.method=='cash'?`<div class="g"><input id="given" type="number" inputmode="numeric" placeholder="Customer gave (optional)" value="${S.given||''}" oninput="S.given=this.value;$('#chg').innerHTML=changeText()"><div class="card" id="chg" style="padding:10px 12px">${changeText()}</div></div>`:''}
 <button class="p" style="width:100%" onclick="checkout()">Sell · ${kes(t)}</button>`}
function changeText(){const g=+S.given,t=total();if(!g)return'<small>Change</small>';
 return g<t?`<small class="low">Short by ${kes(r2(t-g))}</small>`:`<small>Change</small><b style="font-size:18px">${kes(r2(g-t))}</b>`}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;d.setAttribute('data-nt','');document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function add(id,inCart){const p=S.products.find(x=>x.id==id),step=p.unit=='g'||p.unit=='ml'?100:1;
 S.cart[id]=rq((S.cart[id]||0)+step);$('#cart').innerHTML=cartView();
 if(!inCart){toast('✓ '+p.name+' · '+fq(S.cart[id])+' '+p.unit);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}}
function dec(id){const p=S.products.find(x=>x.id==id),step=p.unit=='g'||p.unit=='ml'?100:1;
 S.cart[id]=rq(S.cart[id]-Math.min(step,S.cart[id]>=step?step:S.cart[id]));if(S.cart[id]<=0)delete S.cart[id];$('#cart').innerHTML=cartView()}
function setQ(id,v){S.cart[id]=v;$('#cart').innerHTML=cartView()}
// "Nipe sugar ya 50": work out the weight from the money.
function byMoney(id){const p=S.products.find(x=>x.id==id),pr=price(p);if(!(pr>0))return alert('Set a selling price for this product first');
 const a=parseFloat(prompt(`How much money? (KES)\n${p.name}: ${kes(pr)} per ${p.unit}`,''));if(!(a>0))return;
 S.cart[id]=rq(a/pr);$('#cart').innerHTML=cartView()}
function clearCart(){if(Object.keys(S.cart).length>1&&!confirm('Clear the cart?'))return;S.cart={};S.pr={};S.given='';$('#cart').innerHTML=''}
async function checkout(){
 const items=Object.entries(S.cart).map(([id,q])=>({p:S.products.find(x=>x.id==id),q}));
 const over=items.filter(({p,q})=>q>p.stock_qty);if(over.length&&!confirm('Not enough stock: '+over.map(({p})=>p.name+' ('+p.stock_qty+' left)').join(', ')+'. Sell anyway?'))return;
 const t=total();let paid=t,code=null;
 if(S.method=='debt'){if(!S.cust)return alert('Choose a customer');
  const a=prompt('Amount paid now (0 if none)','0');if(a===null)return;paid=Math.min(t,Math.max(0,+a||0));
  const c=S.customers.find(x=>x.customer_id==S.cust),nb=r2(+(c&&c.balance||0)+t-paid);
  if(c&&c.credit_limit!=null&&nb>+c.credit_limit){const msg=`This sale takes ${c.name} to ${kes(nb)}, over the credit limit of ${kes(c.credit_limit)}.`;
   if(S.role!='owner')return alert(msg+' Ask the owner.');if(!confirm(msg+' Sell anyway?'))return}}
 if(S.method=='mpesa')code=(prompt('M-Pesa code (optional)')||'').toUpperCase()||null;
 const sid=crypto.randomUUID();
 const sale={id:sid,shop_id:S.shop.id,customer_id:S.method=='debt'?S.cust:null,total:t,paid,method:S.method,mpesa_code:code,created_by:S.uid,created_at:new Date().toISOString()};
 const rows=items.map(({p,q})=>({id:crypto.randomUUID(),sale_id:sid,shop_id:S.shop.id,product_id:p.id,name:p.name+(p.variant?' · '+p.variant:''),qty:q,unit_price:price(p),unit_cost:p.buy_price}));
 const x={sale,items:rows};let queued=false;
 try{if(!navigator.onLine)throw new Error('offline');await pushSale(x)}
 catch(e){if(!isNet(e))return alert(e.message||e);setQueue([...queue(),x]);queued=true;S.offline=!navigator.onLine}
 S.cart={};S.pr={};S.cust='';S.q='';S.given='';
 if(queued){items.forEach(({p,q})=>p.stock_qty=+p.stock_qty-q);S.sales.unshift({...sale,voided:false,sale_items:rows,pending:true});saveCache()}
 else{try{await load();saveCache()}catch(e){}}
 render();showReceipt({...sale,voided:false,sale_items:rows,pending:queued})}

// ---------- Receipts ----------
function receiptLines(s){const c=s.customer_id&&S.customers.find(x=>x.customer_id==s.customer_id),d=new Date(s.created_at);
 return{c,no:String(s.id).slice(0,8).toUpperCase(),when:d.toLocaleString('en-KE',{timeZone:'Africa/Nairobi',dateStyle:'medium',timeStyle:'short'}),items:s.sale_items||[]}}
function receiptText(s){const r=receiptLines(s),L=[S.shop.name,S.shop.kra_pin?'KRA PIN: '+S.shop.kra_pin:'',r.when+' · Receipt '+r.no,'----'];
 r.items.forEach(i=>L.push(`${i.name} x${+i.qty} @ ${kes(i.unit_price)} = ${kes(i.qty*i.unit_price)}`));
 L.push('----','TOTAL: '+kes(s.total),'Paid: '+kes(s.paid)+' ('+(s.method=='mpesa'?'M-Pesa':s.method)+')');
 if(+s.total>+s.paid)L.push('Balance: '+kes(s.total-s.paid));if(s.mpesa_code)L.push('M-Pesa: '+s.mpesa_code);if(s.voided)L.push('*** VOIDED ***');
 L.push('','Asante! Thank you.');return L.filter((x,i)=>x!==''||i>3).join('\n')}
function showReceipt(s){const r=receiptLines(s),ph=r.c&&r.c.phone?(r.c.phone.replace(/\D/g,'').replace(/^0/,'254')):'';
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" onclick="if(event.target==this)closeEdit()"><div class="sheet">
 <h3>${s.pending?'Sale saved on this phone ✔':'Sale saved ✔'}</h3>${s.pending?'<p class="lb">You are offline. It will sync automatically when you are back online.</p>':''}
 <div class="rc" id="rcpt" data-nt><h4>${esc(S.shop.name)}</h4>${S.shop.phone?`<div class="c">${esc(S.shop.phone)}</div>`:''}${S.shop.kra_pin?`<div class="c">KRA PIN: ${esc(S.shop.kra_pin)}</div>`:''}
 <div class="c">${esc(r.when)} · No. ${esc(r.no)}</div><hr>
 ${r.items.map(i=>`<div>${esc(i.name)}</div><div class="l"><span>${+i.qty} × ${kes(i.unit_price)}</span><span>${kes(i.qty*i.unit_price)}</span></div>`).join('')}<hr>
 <div class="l t"><span>TOTAL</span><span>${kes(s.total)}</span></div><div class="l"><span>Paid (${s.method=='mpesa'?'M-Pesa':esc(s.method)})</span><span>${kes(s.paid)}</span></div>
 ${+s.total>+s.paid?`<div class="l"><span>Balance</span><span>${kes(s.total-s.paid)}</span></div>`:''}${s.mpesa_code?`<div class="l"><span>M-Pesa code</span><span>${esc(s.mpesa_code)}</span></div>`:''}
 ${r.c?`<div class="l"><span>Customer</span><span>${esc(r.c.name)}</span></div>`:''}${s.voided?'<div class="c t">*** VOIDED ***</div>':''}<hr><div class="c">Asante! Thank you.</div></div>
 <div class="m"><button onclick="window.print()">🖨 Print</button><a style="flex:1" href="https://wa.me/${ph}?text=${encodeURIComponent(receiptText(s))}" target="_blank" rel="noopener"><button style="width:100%">WhatsApp</button></a><button class="p" onclick="closeEdit()">Close</button></div></div></div>`)}
async function sendSms(id,btn){if(S.shop.plan!='premium'){alert('SMS reminders are part of the Premium plan.');return showPlans()}
 if(!confirm('Send an SMS reminder to this customer?'))return;btn.disabled=true;
 const {error}=await sb.functions.invoke('send-sms',{body:{shop_id:S.shop.id,customer_id:id}});btn.disabled=false;

async function addProduct(){const v=i=>{const e=$('#'+i);return e?e.value.trim():''};if(!v('pn'))return alert('Enter a name');
 const {error}=await sb.from('products').insert({shop_id:S.shop.id,name:v('pn'),buy_price:+v('pb')||0,sell_price:+v('ps')||0,stock_qty:+v('pq')||0,unit:v('pu'),category:v('pc')||null,variant:v('pv')||null,sku:v('sk')||null,expiry:v('px')||null,low_stock_at:v('pr')===''?5:(+v('pr')||0)});
 if(error)return alert(/products_shop_sku/.test(error.message)?'That barcode is already used by another product':error.message);await load();render()}

// ---------- Stock list: search, sort, category ----------
const cats=()=>[...new Set(S.products.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
function stockList(){const q=(S.sq||'').toLowerCase().trim(),c=S.sc||'',srt=S.ss||'name';
 let L=S.products.filter(p=>(!c||p.category==c)&&(!q||[p.name,p.variant,p.category,p.sku].join(' ').toLowerCase().includes(q)));
 const by={name:(a,b)=>a.name.localeCompare(b.name),
  low:(a,b)=>((b.stock_qty<=b.low_stock_at)-(a.stock_qty<=a.low_stock_at))||(a.stock_qty/(a.low_stock_at||1))-(b.stock_qty/(b.low_stock_at||1)),
  qty:(a,b)=>a.stock_qty-b.stock_qty, value:(a,b)=>b.stock_qty*b.buy_price-a.stock_qty*a.buy_price,
  exp:(a,b)=>(a.expiry||'9999')<(b.expiry||'9999')?-1:1};
 L=L.sort(by[srt]||by.name);

// Minimal .xlsx reader (zip + XML) using the browser's own decompression; reads the first sheet.
async function readXlsx(buf){const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
 let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('This is not an Excel (.xlsx) file');
 const files={};let p=dv.getUint32(e+16,true);
 for(let i=0,n=dv.getUint16(e+10,true);i<n&&dv.getUint32(p,true)===0x02014b50;i++){const nl=dv.getUint16(p+28,true);
  files[td.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true)}
 const get=async n=>{const f=files[n];if(!f)return null;const s=f.off+30+dv.getUint16(f.off+26,true)+dv.getUint16(f.off+28,true),d=u8.subarray(s,s+f.cs);
  if(f.m===0)return td.decode(d);if(typeof DecompressionStream=='undefined')throw new Error('This browser cannot open Excel files. Save the sheet as CSV and import that.');
  return new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};
 const xml=s=>new DOMParser().parseFromString(s,'application/xml'),tags=(n,t)=>[...n.getElementsByTagName(t)];
 const ss=[],sx=await get('xl/sharedStrings.xml');if(sx)tags(xml(sx),'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
 const sheet=files['xl/worksheets/sheet1.xml']?'xl/worksheets/sheet1.xml':Object.keys(files).find(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k));
 if(!sheet)throw new Error('No sheet found in this file');
 const col=r=>[...r.replace(/\d+/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
 return tags(xml(await get(sheet)),'row').map(r=>{const row=[];tags(r,'c').forEach(c=>{const t=c.getAttribute('t'),v=tags(c,'v')[0];
  row[col(c.getAttribute('r')||'A')]=t=='s'?ss[+(v&&v.textContent)]:t=='inlineStr'?tags(c,'t').map(x=>x.textContent).join(''):(v?v.textContent:'')});
  return Array.from(row,x=>x??'')})}
function readCsv(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'',d=(first.split(';').length>first.split(',').length)?';':',';
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const ch=text[i];
  if(q){if(ch=='"'){if(text[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch=='"')q=true;else if(ch==d){row.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&text[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
 if(f||row.length){row.push(f);rows.push(row)}return rows}
const IMPORT_COLS={name:['name','product','productname','item','itemname','description','jina','bidhaa'],

async function parseImport(file){const out=$('#imp');if(!file)return;out.innerHTML='<p class="lb">Reading file…</p>';
 try{const rows=/\.xlsx$/i.test(file.name)?await readXlsx(await file.arrayBuffer()):readCsv(await file.text());
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim()));if(hi<0)throw new Error('The file is empty');
  const head=rows[hi].map(h=>String(h).toLowerCase().replace(/[^a-z]/g,'')),ix={};
  for(const[k,names]of Object.entries(IMPORT_COLS)){const i=head.findIndex(h=>names.includes(h));if(i>=0)ix[k]=i}
  if(ix.name==null)throw new Error('No "Name" column found. The first row must have column names.');
  const units=unitsFor(),cell=(r,k)=>ix[k]==null?'':String(r[ix[k]]??'').trim(),errs=[],items=[],seen=new Set();
  rows.slice(hi+1).forEach((r,n)=>{const name=cell(r,'name');if(!name)return;const line=hi+n+2;
   const it={name:name.slice(0,120),variant:cell(r,'variant')||null,category:cell(r,'category')||null,sku:cell(r,'sku')||null,
    unit:cell(r,'unit')||null,buy:num(cell(r,'buy')),sell:num(cell(r,'sell')),qty:num(cell(r,'qty')),reorder:num(cell(r,'reorder')),expiry:excelDate(cell(r,'expiry'))};
   if(it.qty!=null&&it.qty<0||it.buy!=null&&it.buy<0||it.sell!=null&&it.sell<0)return errs.push(`Row ${line}: negative number`);
   const key=it.sku?'s:'+it.sku.toLowerCase():'n:'+(it.name+'|'+(it.variant||'')).toLowerCase();if(seen.has(key))return errs.push(`Row ${line}: ${name} appears twice`);seen.add(key);
   it.match=S.products.find(p=>it.sku&&p.sku&&p.sku.toLowerCase()==it.sku.toLowerCase())||S.products.find(p=>(p.name+'|'+(p.variant||'')).toLowerCase()==(it.name+'|'+(it.variant||'')).toLowerCase());
   if(it.unit&&!it.match&&!units.includes(it.unit)){const u=units.find(x=>x.toLowerCase()==it.unit.toLowerCase());if(u)it.unit=u}
   items.push(it)});
  if(!items.length)throw new Error('No products found under the column names');
  const add=items.filter(i=>!i.match),upd=items.filter(i=>i.match);
  if(S.shop.plan=='basic'&&S.products.length+add.length>300)throw new Error(`Your Basic plan allows 300 products. This file would bring you to ${S.products.length+add.length}. Upgrade to Standard for unlimited products.`);
  S.imp=items;
  out.innerHTML=`<div class="card"><span class="pn">${add.length} new · ${upd.length} to update</span><small>${ix.qty==null?'No quantity column: stock levels stay as they are.':'Quantities in the file become the stock level (changes are logged).'}</small>
   ${errs.length?`<small class="low">${errs.length} row(s) skipped: ${esc(errs.slice(0,5).join('; '))}${errs.length>5?'…':''}</small>`:''}</div>
   ${items.slice(0,8).map(i=>`<div class="row"><div>${esc(i.name)}${i.variant?' · '+esc(i.variant):''}<small>${i.match?'update':'new'} · ${i.sell!=null?kes(i.sell):'no price'}${i.qty!=null?' · '+i.qty+' '+esc(i.unit||(i.match&&i.match.unit)||'pc'):''}</small></div></div>`).join('')}
   ${items.length>8?`<p class="lb">…and ${items.length-8} more</p>`:''}<button class="p" style="width:100%" onclick="runImport(this)">Import ${items.length} product(s)</button>`}
 catch(e){S.imp=null;out.innerHTML=`<p class="low">${esc(e.message||e)}</p>`}}
async function runImport(btn){const items=S.imp;if(!items)return;btn.disabled=true;btn.textContent='Importing…';const sid=S.shop.id,moves=[];
 try{const add=items.filter(i=>!i.match).map(i=>({shop_id:sid,name:i.name,variant:i.variant,category:i.category,sku:i.sku,unit:i.unit||'pc',
   buy_price:i.buy||0,sell_price:i.sell||0,stock_qty:i.qty||0,low_stock_at:i.reorder??5,expiry:i.expiry}));
  for(let k=0;k<add.length;k+=200){const {error}=await sb.from('products').insert(add.slice(k,k+200));
   if(error)throw new Error(/products_shop_sku/.test(error.message)?'A barcode in the file is already used by another product':error.message)}
  const upd=items.filter(i=>i.match);
  for(let k=0;k<upd.length;k+=10)await Promise.all(upd.slice(k,k+10).map(async i=>{const p=i.match,u={};
   if(i.category)u.category=i.category;if(i.sku)u.sku=i.sku;if(i.unit)u.unit=i.unit;if(i.buy!=null)u.buy_price=i.buy;if(i.sell!=null)u.sell_price=i.sell;
   if(i.reorder!=null)u.low_stock_at=i.reorder;if(i.expiry)u.expiry=i.expiry;if(i.qty!=null&&i.qty!=+p.stock_qty){u.stock_qty=i.qty;moves.push({shop_id:sid,product_id:p.id,change:rq(i.qty-p.stock_qty),reason:'import'})}

  if(moves.length){const {error}=await sb.from('stock_movements').insert(moves);if(error)console.warn(error)}
  closeEdit();await load();saveCache();render();alert(`Imported ✔ ${add.length} added, ${upd.length} updated.`)}
 catch(e){btn.disabled=false;btn.textContent='Try again';alert('Import stopped: '+(e.message||e)+'\nProducts saved before the error are kept.');await load();render()}}

function parseLine(line){let t=line.replace(/\b(ksh|kshs|kes|sh|shs|bob)\.?\b/gi,' ').replace(/\/=/g,' ').replace(/[@x×]\s*(?=\d)/gi,' ').trim();if(!t)return null;

 else parts=t.replace(/(\d),(\d{3})\b/g,'$1$2').split(/[\s,;]+/).filter(Boolean);
 // "50 kg" -> "50kg"
 for(let i=parts.length-1;i>0;i--)if(UNIT_WORDS[parts[i].toLowerCase()]&&/^\d+(\.\d+)?$/.test(parts[i-1])){parts[i-1]+=parts[i];parts.splice(i,1)}

  const u=m[2]?UNIT_WORDS[m[2].toLowerCase()]:null;if(m[2]&&!u)break;tail.unshift({n:+m[1],u});parts.pop()}

function stkMode(review){const a=$('#stks'),b=$('#stkr');if(a)a.style.display=review?'none':'';if(b)b.style.display=review?'none':''}
function stkList(){const q=(S.stq||'').toLowerCase();
 return S.products.filter(p=>!q||[p.name,p.variant,p.category,p.sku].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.category||'').localeCompare(b.category||'')||a.name.localeCompare(b.name))
  .map(p=>`<div class="row"><div>${pn(p)}<small>System: ${fq(p.stock_qty)} ${esc(p.unit)}${p.category?' · '+esc(p.category):''}</small></div><input style="width:96px;margin:0" type="number" step="any" inputmode="decimal" placeholder="Count" value="${S.stc[p.id]??''}" oninput="stkSet('${p.id}',this.value)"></div>`).join('')||'<p>No products match.</p>'}
function stkSet(id,v){if(v==='')delete S.stc[id];else S.stc[id]=v;lsSet(STK(),S.stc)}
function stkReview(){const L=Object.entries(S.stc).map(([id,v])=>{const p=S.products.find(x=>x.id==id);return p&&{p,c:+v,d:rq(+v-p.stock_qty)}}).filter(x=>x&&x.c>=0&&isFinite(x.c));
 if(!L.length)return alert('Type at least one count');const ch=L.filter(x=>x.d);stkMode(true);
 const miss=ch.filter(x=>x.d<0),extra=ch.filter(x=>x.d>0),vm=r2(miss.reduce((a,x)=>a-x.d*x.p.buy_price,0)),ve=r2(extra.reduce((a,x)=>a+x.d*x.p.buy_price,0));
 $('#stk').innerHTML=`<div class="g"><div class="card">Counted<b>${L.length}</b><small>${L.length-ch.length} match the system</small></div><div class="card">Missing<b class="${vm?'low':''}">${kes(vm)}</b><small>${miss.length} product(s), at buying price</small></div></div>
  ${extra.length?`<p class="lb">Extra found: ${kes(ve)} in ${extra.length} product(s).</p>`:''}
  ${ch.sort((a,b)=>a.d*a.p.buy_price-b.d*b.p.buy_price).map(x=>`<div class="row"><div>${pn(x.p)}<small>System ${fq(x.p.stock_qty)} → counted ${fq(x.c)} ${esc(x.p.unit)}</small></div><b class="${x.d<0?'low':''}">${x.d>0?'+':''}${fq(x.d)} · ${kes(r2(x.d*x.p.buy_price))}</b></div>`).join('')||'<p>Everything you counted matches. 🎉</p>'}
  ${ch.length?`<button class="p" style="width:100%" onclick="stkApply(this)">Apply ${ch.length} correction(s)</button>`:''}<p><button class="s" onclick="stkMode(false);$('#stk').innerHTML=stkList()">← Back to counting</button></p>`}
async function stkApply(btn){btn.disabled=true;const counts=Object.entries(S.stc).filter(([,v])=>v!==''&&+v>=0).map(([id,v])=>({id,qty:+v}));
 const {data,error}=await sb.rpc('apply_stocktake',{p_shop:S.shop.id,p_counts:counts});if(error){btn.disabled=false;return alert(error.message)}
 const r=data&&data[0]||{};lsSet(STK(),'');S.stc={};closeEdit();await load();saveCache();render();
 alert(`Stock-take saved ✔ ${r.changed||0} product(s) corrected.${+r.value_missing?' Missing: '+kes(r.value_missing)+'.':''}`)}

// ---------- Camera barcode scanning (Android Chrome; other phones can use a scanner or type) ----------
async function scanInto(inputId,cb){
 if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return alert('This browser cannot scan with the camera. Use Chrome on Android, a barcode scanner, or type the code.');
 let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']})}catch(e){det=new BarcodeDetector()}
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="scanm"><div class="sheet"><h3>Point the camera at the barcode</h3>
  <video id="scv" playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:60vh"></video><p><button style="width:100%" onclick="stopScan()">Cancel</button></p></div></div>`);
 try{S.scs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){stopScan();return alert('Camera not allowed. Allow camera access for this site and try again.')}
 const v=$('#scv');v.srcObject=S.scs;await v.play().catch(()=>{});
 const tick=async()=>{if(!S.scs)return;try{const r=await det.detect(v);if(r&&r.length){const code=r[0].rawValue;stopScan();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
   if(inputId){const el=$('#'+inputId);if(el)el.value=code}if(cb)cb(code);return}}catch(e){}setTimeout(tick,250)};tick()}
function stopScan(){if(S.scs){S.scs.getTracks().forEach(t=>t.stop());S.scs=null}const m=$('#scanm');if(m)m.remove()}
function sellScanned(code){const p=S.products.find(x=>x.sku&&x.sku.toLowerCase()==code.toLowerCase());
 if(p)return add(p.id);
 if(S.role=='owner'&&confirm('No product has barcode '+code+'. Add it to your stock now?'))return newFromBarcode(code);
 alert('No product has barcode '+code+'. Ask the owner to add it in Stock.')}

// ---------- Today: reports for any period ----------
const dAdd=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dSpan=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)+1;
const dLabel=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-KE',{day:'numeric',month:'short'});
const wkday=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-KE',{weekday:'short'});
function periodRange(){const t=today(),k=S.per||'today';
 if(k=='yesterday')return[dAdd(t,-1),dAdd(t,-1)];
 if(k=='week'){const dow=(new Date(t+'T12:00:00Z').getUTCDay()+6)%7;return[dAdd(t,-dow),t]}
 if(k=='month')return[t.slice(0,8)+'01',t];
 if(k=='lastmonth'){const f=dAdd(t.slice(0,8)+'01',-1).slice(0,8)+'01';return[f,dAdd(t.slice(0,8)+'01',-1)]}
 if(k=='custom'&&S.pf&&S.pt)return S.pf<=S.pt?[S.pf,S.pt]:[S.pt,S.pf];
 return[t,t]}
// The period we compare with: same weekday last week for one day; the previous week/month otherwise.
function prevRange(){const[f,t]=periodRange(),k=S.per||'today',n=dSpan(f,t);
 if(n==1)return[dAdd(f,-7),dAdd(t,-7),'last '+wkday(f)];
 if(k=='month'||k=='lastmonth'){const pf=dAdd(f,-1).slice(0,8)+'01';const pt=k=='month'?dAdd(pf,n-1):dAdd(f,-1);return[pf,pt,k=='month'?'same days last month':'the month before']}
 if(k=='week')return[dAdd(f,-7),dAdd(t,-7),'last week'];
 return[dAdd(f,-n),dAdd(f,-1),'the previous '+n+' days']}
const isTodayRange=()=>{const[f,t]=periodRange();return f==t&&t==today()};
function periodPicker(){const k=S.per||'today',[f,t]=periodRange();
 const opts=[['today','Today'],['yesterday','Yesterday'],['week','This week'],['month','This month'],['lastmonth','Last month'],['custom','Pick dates']];
 return`<div class="chips per">${opts.map(([v,l])=>`<button class="s${k==v?' on':''}" onclick="setPeriod('${v}')">${l}</button>`).join('')}</div>
 ${k=='custom'?`<div class="g"><input type="date" value="${S.pf||f}" max="${today()}" onchange="S.pf=this.value;refreshReport()"><input type="date" value="${S.pt||t}" max="${today()}" onchange="S.pt=this.value;refreshReport()"></div>`:''}
 ${f!=t?`<p class="lb">${dLabel(f)} – ${dLabel(t)}</p>`:(k!='today'?`<p class="lb">${dLabel(f)}</p>`:'')}`}
function setPeriod(k){S.per=k;if(k=='custom'&&!S.pf){S.pf=dAdd(today(),-6);S.pt=today()}refreshReport()}
async function refreshReport(){S.rep=null;render();try{await loadReport()}catch(e){if(!isNet(e))alert(e.message||e)}render()}
async function loadReport(){if(!S.shop)return;const sid=S.shop.id,[f,t]=periodRange(),[pf,pt]=prevRange(),own=S.role=='owner';
 const [a,b,e,c,tm]=await Promise.all([sb.rpc('shop_report',{p_shop:sid,p_from:f,p_to:t}),sb.rpc('shop_report',{p_shop:sid,p_from:pf,p_to:pt}),
  sb.from('expenses').select('id,label,category,amount,paid_from,spent_on,created_at').eq('shop_id',sid).gte('spent_on',f).lte('spent_on',t).order('spent_on',{ascending:false}).limit(200),
  sb.from('cash_counts').select('*').eq('shop_id',sid).order('created_at',{ascending:false}).limit(20),
  own&&!S.team?sb.rpc('shop_team',{p_shop:sid}):Promise.resolve({data:S.team||null})]);
 const err=[a,b,e,c].find(r=>r.error);if(err)throw err.error;
 S.rep=a.data;S.repPrev=b.data;S.exps=e.data||[];S.counts=c.data||[];if(tm&&tm.data)S.team=tm.data}
const pct=(a,b)=>!(+b)?null:Math.round((a-b)/b*100);
function delta(a,b,label){const p=pct(+a,+b);if(p===null)return'';return`<small class="${p<0?'low':''}">${p>0?'↑':p<0?'↓':'='} ${Math.abs(p)}% vs ${label}</small>`}
function reportCards(R,P){const[, ,lbl]=prevRange(),own=S.role=='owner',rp=reports()&&own;
 const moneyIn=r2(+R.cash_sales+ +R.mpesa_sales+ +R.debt_cash+ +R.debt_mpesa),coll=r2(+R.debt_cash+ +R.debt_mpesa),net=r2(+R.gross_profit- +R.expenses);
 return`<div class="g">
 <div class="card">Sales<b>${kes(R.sales_total)}</b><small>${R.sales_count} sale(s)</small>${P?delta(R.sales_total,P.sales_total,lbl):''}</div>
 <div class="card">Money in<b>${kes(moneyIn)}</b><small>Cash ${kes(r2(+R.cash_sales+ +R.debt_cash))} · M-Pesa ${kes(r2(+R.mpesa_sales+ +R.debt_mpesa))}</small></div>
 <div class="card">New debt<b>${kes(R.new_debt)}</b><small>given on credit</small></div>
 <div class="card">Debt collected<b>${kes(coll)}</b><small>paid back by customers</small></div>
 <div class="card">Expenses<b>${kes(R.expenses)}</b><small>${S.exps&&S.exps.length?S.exps.length+' item(s)':'none recorded'}</small></div>
 ${rp?`<div class="card">Gross profit<b>${kes(r2(R.gross_profit))}</b><small>sales minus buying price</small>${P?delta(R.gross_profit,P.gross_profit,lbl):''}</div>
 <div class="card">Net profit<b class="${net<0?'low':''}">${kes(net)}</b><small>after expenses</small></div>`:''}
 <div class="card">Total owed<b>${kes(owed())}</b><small>${debtors()} customer(s)</small></div>
 ${rp?`<div class="card">Stock value<b>${kes(r2(stockVal()))}</b><small>at cost price</small></div>`:''}</div>
 ${+R.voided_count?`<p class="lb">${R.voided_count} voided sale(s) worth ${kes(R.voided_total)} are not counted.</p>`:''}`}
function payMixR(R){const x={cash:+R.cash_sales,mpesa:+R.mpesa_sales,debt:+R.new_debt},T=x.cash+x.mpesa+x.debt;if(!T)return'';const pc=k=>Math.round(x[k]/T*100);
 return`<h3>Sales by payment</h3><div class="mix"><i style="width:${pc('cash')}%;background:var(--accent)"></i><i style="width:${pc('mpesa')}%;background:#8fb996"></i><i style="width:${pc('debt')}%;background:var(--rose)"></i></div><p class="lb">Cash ${kes(x.cash)} · M-Pesa ${kes(x.mpesa)} · Debt ${kes(x.debt)}</p>`}
function trendChart(R){const[f,t]=periodRange(),n=dSpan(f,t);if(n==1)return chart7();if(n>62)return'';
 const m={};(R.by_day||[]).forEach(d=>m[d.day]=+d.sales);const days=[];for(let i=0;i<n;i++)days.push(dAdd(f,i));
 const v=days.map(d=>m[d]||0),mx=Math.max(1,...v),lab=x=>x?(x>=1000?(x/1000).toFixed(1)+'k':Math.round(x)):'';
 return`<h3>Sales by day</h3><div class="bars">${days.map((d,i)=>`<div class="bar">${n<=10?`<small>${lab(v[i])}</small>`:''}<i style="height:${Math.max(3,Math.round(v[i]/mx*56))}px"></i><small>${n<=8?wkday(d):d.slice(8)}</small></div>`).join('')}</div>`}
function topItems(R){const t=(R.top_items||[]).slice(0,5);if(!t.length)return'';
 return`<h3>Top sellers</h3>${t.map((x,i)=>`<div class="row"><div>${i+1}. ${esc(x.name)}<small>${fq(x.qty)} sold · profit ${kes(r2(x.profit))}</small></div><b>${kes(r2(x.revenue))}</b></div>`).join('')}`}
function staffSales(R){if(S.role!='owner'||!(R.by_staff||[]).length)return'';const nm=u=>u==S.uid?'You':((S.team||[]).find(x=>x.user_id==u)||{}).email||'Staff';
 if(R.by_staff.length<2&&R.by_staff[0].user==S.uid&&!(S.team||[]).some(x=>x.role=='staff'))return'';
 return`<h3>Sales by staff</h3>${R.by_staff.map(x=>`<div class="row"><div>${esc(nm(x.user))}<small>${x.count} sale(s)</small></div><b>${kes(x.sales)}</b></div>`).join('')}`}
